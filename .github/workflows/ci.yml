name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt ruff==0.17.1 pip-audit==2.10.1
      - run: ruff check .
      - run: python -W error::ResourceWarning -m unittest discover -v
      - run: pip-audit -r requirements.txt
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - run: $(go env GOPATH)/bin/gitleaks dir . --redact --no-banner
